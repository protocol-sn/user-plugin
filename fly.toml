# fly.toml app configuration file generated for keycloak-user-plugin on 2025-10-02T14:26:19-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'keycloak-user-plugin'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile.fly'

[http_service]
  internal_port = 8080
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[services]]
  protocol = 'tcp'
  internal_port = 50051

  [[services.ports]]
    port = 50051

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
