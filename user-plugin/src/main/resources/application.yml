micronaut:
  application:
    name: ProtocolSNUserPlugin
  server:
    cors:
      enabled: true
    port: 8081
    context-path: /
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        mapping: /swagger-ui/**
        paths: classpath:META-INF/swagger/views/swagger-ui
  http:
    services:
      keycloak-admin:
        url: http://localhost:9080/
      node-manager::registration:
        url: http://localhost:8080
  security:
    token:
      jwt:
        signatures:
          jwks:
            keycloak:
              url: http://localhost:9080/realms/social-network-ecosystem/protocol/openid-connect/certs
    oauth2:
      clients:
        local-keycloak:
          client-id: user-plugin
          client-secret: user-plugin-secret
          openid:
            issuer: http://localhost:9080/realms/social-network-ecosystem
        keycloak-client:
          client-id: user-plugin
          client-secret: user-plugin-secret
          grant-type: client_credentials
          token:
            url: http://localhost:9080/realms/social-network-ecosystem/protocol/openid-connect/token
            auth-method: client_secret_post
          client-credentials:
            service-id-regex: node-manager::registration|keycloak-admin
          openid:
            issuer: http://localhost:9080/realms/social-network-ecosystem
    endpoints:
      logout:
        get-allowed: true
    authentication: bearer
    intercept-url-map:
      - pattern: /favicon.ico
        httpMethod: GET
        access:
          - isAnonymous()
      - pattern: /swagger/**
        httpMethod: GET
        access:
          - isAnonymous()
      - pattern: /swagger-ui/**
        httpMethod: GET
        access:
          - isAnonymous()

coop:
  stlma:
    tech:
      protocolsn:
        plugin-name: ProtocolSNUserPlugin
        plugin-host: http://localhost:8081

logger:
  levels:
    coop.stlma.tech.protocolsn: DEBUG
    io.micronaut.security: DEBUG
    io.micronaut.http: DEBUG
