micronaut:
  server:
    port: 8080
  http:
    services:
      keycloak-admin:
        url: http://${KEYCLOAK_HOST}/
  security:
    token:
      jwt:
        signatures:
          jwks:
            keycloak:
              url: http://${KEYCLOAK_HOST}/realms/social-network-ecosystem/protocol/openid-connect/certs
    oauth2:
      clients:
        local-keycloak:
          client-id: user-plugin
          client-secret: ${USER_PLUGIN_CLIENT_SECRET}
          openid:
            issuer: http://${KEYCLOAK_HOST}/realms/social-network-ecosystem
        keycloak-client:
          client-id: user-plugin
          client-secret: ${USER_PLUGIN_CLIENT_SECRET}
          grant-type: client_credentials
          token:
            url: http://${KEYCLOAK_HOST}/realms/social-network-ecosystem/protocol/openid-connect/token
            auth-method: client_secret_post
          client-credentials:
            service-id-regex: node-manager::registration|keycloak-admin
          openid:
            issuer: http://${KEYCLOAK_HOST}/realms/social-network-ecosystem
    endpoints:
      logout:
        get-allowed: true
    authentication: bearer
    intercept-url-map:
      - pattern: /favicon.ico
        httpMethod: GET
        access:
          - isAnonymous()
      - pattern: /swagger/**
        httpMethod: GET
        access:
          - isAnonymous()
      - pattern: /swagger-ui/**
        httpMethod: GET
        access:
          - isAnonymous()

coop:
  stlma:
    tech:
      protocolsn:
        plugin-name: ProtocolSNUserPlugin
        plugin-host: ${USER_PLUGIN_HOST}
        plugin-grpc-port: ${USER_PLUGIN_GRPC_PORT}

grpc:
  server:
    port: ${USER_PLUGIN_GRPC_PORT}
  channels:
    node-manager:
      address: ${NODE_MANAGER_HOST}
      plaintext: true
