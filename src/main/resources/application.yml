micronaut:
  application:
    name: ProtocolSNKeycloakUserPlugin
  server:
    cors:
      enabled: true
    port: 8081
    context-path: /
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        mapping: /swagger-ui/**
        paths: classpath:META-INF/swagger/views/swagger-ui
    oauth2:
      clients:
        keycloak:
          client-id: user-plugin
          client-secret: user-plugin-secret
          openid:
            issuer: http://localhost:9080/realms/social-network-ecosystem
    endpoints:
      logout:
        get-allowed: true
    authentication: idtoken
    intercept-url-map:
      - pattern: /favicon.ico
        httpMethod: GET
        access:
          - isAnonymous()
      - pattern: /swagger/**
        httpMethod: GET
        access:
          - isAnonymous()
      - pattern: /swagger-ui/**
        httpMethod: GET
        access:
          - isAnonymous()

coop:
  stlma:
    tech:
      protocolsn:
        plugin-name: ProtocolSNUserPlugin
        plugin-host: localhost
        plugin-grpc-port: 8091

grpc:
  server:
    port: 8091
  channels:
    node-manager:
      target: localhost:8090
      plaintext: true
